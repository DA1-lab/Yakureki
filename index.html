<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yakureki Dummy v0.3</title>
<style>
:root{
  --panel-width:min(390px,92vw);
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  background:#f5f7f8;
  color:#233238;
}
.main{
  min-height:100vh;
  padding:18px;
}
.card{
  background:#fff;
  border:1px solid #d8e0e3;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  max-width:1000px;
}
textarea{
  width:100%;
  min-height:150px;
  font-size:16px;
  padding:10px;
  border:1px solid #cbd5d8;
  border-radius:10px;
}

/* 右から飛び出す入力補助パネル */
.drawer{
  position:fixed;
  top:0;
  right:0;
  width:var(--panel-width);
  height:100dvh;
  background:#fff;
  border-left:1px solid #d8e0e3;
  box-shadow:-10px 0 28px rgba(0,0,0,.14);
  z-index:1001;
  transform:translateX(100%);
  transition:transform .24s ease;
  overflow-y:auto;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
.drawer.open{
  transform:translateX(0);
}

/* 開閉ボタン */
.drawer-tab{
  position:fixed;
  right:0;
  top:50%;
  transform:translateY(-50%);
  z-index:1002;
  border:0;
  border-radius:12px 0 0 12px;
  padding:14px 10px;
  background:#28a89a;
  color:#fff;
  font-weight:800;
  font-size:14px;
  writing-mode:vertical-rl;
  letter-spacing:.08em;
  box-shadow:-4px 4px 14px rgba(0,0,0,.15);
  touch-action:manipulation;
  transition:right .24s ease, background .2s ease;
}
.drawer-tab.open{
  right:var(--panel-width);
  background:#56666b;
}
.drawer-tab:active{transform:translateY(-50%) scale(.98)}

.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.drawer-head h2{
  margin:0;
  font-size:21px;
}
.close-btn{
  border:0;
  background:#edf1f2;
  border-radius:9px;
  padding:8px 10px;
  font-weight:700;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.field{
  border:1px solid #d8e0e3;
  border-radius:10px;
  padding:10px;
  background:#fff;
}
.field-title{
  font-size:12px;
  color:#6d7b80;
  font-weight:700;
  margin-bottom:6px;
}
.field input[type=number]{
  width:90px;
  font-size:17px;
}
.radio-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
h3{
  margin:18px 0 8px;
  font-size:16px;
}
.symptoms{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.sym{
  border:1px solid #bcc8ca;
  background:#fff;
  border-radius:999px;
  padding:10px 14px;
  font-weight:700;
  font-size:15px;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.sym.on{
  background:#e6f6f3;
  border-color:#28a89a;
  color:#176b62;
}
.out{
  white-space:pre-wrap;
  border:1px solid #d8e0e3;
  border-radius:10px;
  background:#f8faf9;
  padding:10px;
  min-height:110px;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}
button.action{
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:800;
  font-size:15px;
}
.copy{background:#28a89a;color:#fff}
.clear{background:#edf1f2}

@media(max-width:820px){
  .main{padding:12px}
  .drawer{
    width:min(390px,94vw);
  }
  :root{
    --panel-width:min(390px,94vw);
  }
}
</style>
</head>
<body>

<main class="main">
  <div class="card">
    <b>薬歴入力ダミー</b>
    <p>右端の「入力補助」を押すと、画面を押し縮めずに補助パネルが重なって開きます。</p>
    <textarea placeholder="例：母より、昨夜から発熱。水分摂取はできている。"></textarea>
  </div>

  <div class="card">
    <b>薬歴イメージ</b>
    <p>S　自由記載</p>
    <p>O　処方・客観情報</p>
    <p>A　評価</p>
    <p>EP　服薬指導</p>
    <p>OP　次回確認</p>
  </div>
</main>

<button id="drawerTab" class="drawer-tab" aria-expanded="false" aria-controls="drawer">
  入力補助
</button>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>小児科サポート</h2>
    <button id="closeBtn" class="close-btn">閉じる</button>
  </div>

  <div class="grid">
    <div class="field">
      <div class="field-title">体重</div>
      <input id="weight" type="number" inputmode="decimal" step="0.1" placeholder="14.2"> kg
    </div>

    <div class="field">
      <div class="field-title">アレルギー</div>
      <div class="radio-row">
        <label><input type="radio" name="allergy" value="なし">なし</label>
        <label><input type="radio" name="allergy" value="あり">あり</label>
      </div>
    </div>
  </div>

  <h3>症状</h3>
  <div class="symptoms">
    <button class="sym">発熱</button><button class="sym">頭痛</button>
    <button class="sym">鼻汁</button><button class="sym">咽頭痛</button>
    <button class="sym">咳</button><button class="sym">喘鳴</button>
    <button class="sym">腹痛</button><button class="sym">嘔吐</button>
    <button class="sym">下痢</button><button class="sym">便秘</button>
    <button class="sym">発疹</button><button class="sym">食欲低下</button>
  </div>

  <h3>生成テキスト</h3>
  <div id="out" class="out">（入力・選択するとここに生成されます）</div>

  <div class="actions">
    <button id="copy" class="action copy">コピー</button>
    <button id="clear" class="action clear">クリア</button>
  </div>
</aside>

<script>
const drawer=document.getElementById('drawer');
const drawerTab=document.getElementById('drawerTab');
const closeBtn=document.getElementById('closeBtn');

function setDrawer(open){
  drawer.classList.toggle('open',open);
  drawerTab.classList.toggle('open',open);
  drawer.setAttribute('aria-hidden',String(!open));
  drawerTab.setAttribute('aria-expanded',String(open));
  drawerTab.textContent=open ? '閉じる' : '入力補助';
}
drawerTab.addEventListener('click',()=>setDrawer(!drawer.classList.contains('open')));
closeBtn.addEventListener('click',()=>setDrawer(false));

const selected=[];
const buttons=[...document.querySelectorAll('.sym')];
const out=document.getElementById('out');
const weight=document.getElementById('weight');
const allergyRadios=[...document.querySelectorAll('input[name="allergy"]')];

function render(){
  const blocks=[];

  if(selected.length){
    blocks.push('##S##\n'+selected.join('、')+'あり。');
  }

  const w=weight.value.trim();
  if(w){
    blocks.push('##O##\n体重'+w+'kg。');
  }

  const allergy=allergyRadios.find(r=>r.checked)?.value;
  if(allergy){
    blocks.push('##O##\n薬剤アレルギー'+allergy+'。');
  }

  out.textContent=blocks.length
    ? blocks.join('\n\n')
    : '（入力・選択するとここに生成されます）';
}

buttons.forEach(b=>b.addEventListener('click',()=>{
  const s=b.textContent;
  const i=selected.indexOf(s);

  if(i>=0){
    selected.splice(i,1);
    b.classList.remove('on');
  }else{
    selected.push(s);
    b.classList.add('on');
  }

  render();
}));

weight.addEventListener('input',render);
allergyRadios.forEach(r=>r.addEventListener('change',render));

document.getElementById('clear').addEventListener('click',()=>{
  selected.length=0;
  buttons.forEach(b=>b.classList.remove('on'));
  weight.value='';
  allergyRadios.forEach(r=>r.checked=false);
  render();
});

document.getElementById('copy').addEventListener('click',async()=>{
  const text=out.textContent;

  if(!text.startsWith('##')){
    alert('コピーする内容がありません');
    return;
  }

  try{
    await navigator.clipboard.writeText(text);
    alert('コピーしました');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert('コピーしました');
  }
});
</script>

</body>
</html>
