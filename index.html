<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yakureki Dummy v1.5</title>
<style>
:root{
  --panel-width:min(410px,94vw);
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  margin:0;
  background:#f5f7f8;
  color:#233238;
}
.main{
  min-height:100vh;
  padding:18px;
}
.card{
  background:#fff;
  border:1px solid #d8e0e3;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  max-width:1000px;
}
textarea{
  width:100%;
  min-height:150px;
  font-size:16px;
  padding:10px;
  border:1px solid #cbd5d8;
  border-radius:10px;
}

/* 右から飛び出す入力補助パネル */
.drawer{
  position:fixed;
  top:0;
  right:0;
  width:var(--panel-width);
  height:100dvh;
  background:#fff;
  border-left:1px solid #d8e0e3;
  box-shadow:-10px 0 28px rgba(0,0,0,.14);
  z-index:1001;
  transform:translateX(100%);
  transition:transform .24s ease;
  overflow-y:auto;
  padding:14px 14px calc(20px + env(safe-area-inset-bottom));
}
.drawer.open{transform:translateX(0)}

.drawer-tab{
  position:fixed;
  right:0;
  top:50%;
  transform:translateY(-50%);
  z-index:1002;
  border:0;
  border-radius:12px 0 0 12px;
  padding:14px 10px;
  background:#28a89a;
  color:#fff;
  font-weight:800;
  font-size:14px;
  writing-mode:vertical-rl;
  letter-spacing:.08em;
  box-shadow:-4px 4px 14px rgba(0,0,0,.15);
  touch-action:manipulation;
  transition:right .24s ease, background .2s ease;
}
.drawer-tab.open{
  right:var(--panel-width);
  background:#56666b;
}
.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}
.drawer-head h2{margin:0;font-size:21px}
.close-btn{
  border:0;
  background:#edf1f2;
  border-radius:9px;
  padding:8px 10px;
  font-weight:700;
  font-size:14px;
}

.top-info{
  display:grid;
  gap:7px;
}
.measure-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.field{
  border:1px solid #d8e0e3;
  border-radius:10px;
  padding:8px 10px;
  background:#fff;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:8px;
}
.field-title{
  font-size:14px;
  color:#46575d;
  font-weight:800;
  margin:0;
  white-space:nowrap;
}
.field input[type=number]{
  width:72px;
  min-width:0;
  font-size:16px;
  padding:5px 6px;
  border:1px solid #cbd5d8;
  border-radius:7px;
}
.unit{
  font-weight:700;
  white-space:nowrap;
}
.compact-record{
  border:1px solid #d8e0e3;
  border-radius:10px;
  padding:7px 9px;
  background:#fff;
}
.record-title{
  font-size:13px;
  font-weight:800;
  color:#46575d;
  margin-bottom:5px;
}
.record-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}
.record-row label{
  white-space:nowrap;
  font-size:13px;
}
.detail-input{
  flex:1 1 auto;
  min-width:0;
  height:32px;
  font-size:14px;
  padding:5px 7px;
  border:1px solid #cbd5d8;
  border-radius:7px;
}
.detail-input:disabled{
  background:#f2f4f5;
  color:#98a4a8;
}
.keep-label{
  display:flex;
  align-items:center;
  gap:2px;
  font-size:12px !important;
  color:#5d6b70;
}
.keep-label input{
  margin:0;
}

h3{
  margin:16px 0 7px;
  font-size:16px;
}
.symptoms{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.sym{
  border:1px solid #bcc8ca;
  background:#fff;
  border-radius:999px;
  padding:10px 14px;
  font-weight:700;
  font-size:15px;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.sym.on{
  background:#e6f6f3;
  border-color:#28a89a;
  color:#176b62;
}

/* コンパクトな3段階ボタン：項目名＋選択肢を1行に */
.status-group{
  border:1px solid #d8e0e3;
  border-radius:10px;
  padding:7px 8px;
  margin-bottom:7px;
  display:grid;
  grid-template-columns:58px 1fr;
  align-items:center;
  gap:7px;
}
.status-label{
  font-weight:800;
  font-size:14px;
  margin:0;
  white-space:nowrap;
}
.status-options{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
}
.status-btn{
  border:1px solid #c5d0d3;
  background:#fff;
  border-radius:8px;
  padding:7px 4px;
  font-size:12px;
  line-height:1.15;
  font-weight:700;
  min-height:34px;
  white-space:nowrap;
}
.status-btn.on{
  background:#e6f6f3;
  border-color:#28a89a;
  color:#176b62;
}

.out{
  white-space:pre-wrap;
  border:1px solid #d8e0e3;
  border-radius:10px;
  background:#f8faf9;
  padding:10px;
  min-height:130px;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}
button.action{
  border:0;
  border-radius:10px;
  padding:12px;
  font-weight:800;
  font-size:15px;
}
.copy{background:#28a89a;color:#fff}
.clear{background:#edf1f2}

/* GitHub Pagesの更新確認用。今後の版でも常時表示 */
.version-badge{
  position:fixed;
  left:10px;
  bottom:10px;
  z-index:900;
  padding:6px 9px;
  border-radius:8px;
  background:rgba(35,50,56,.82);
  color:#fff;
  font-size:12px;
  font-weight:700;
  letter-spacing:.02em;
  pointer-events:none;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}

@media(max-width:820px){
  .main{padding:12px}
  :root{--panel-width:min(410px,94vw)}
}
</style>
</head>
<body>

<main class="main">
  <div class="card">
    <b>薬歴入力ダミー</b>
    <p>右端の「入力補助」を押すと、左側の画面を動かさずに補助パネルが重なって開きます。</p>
    <textarea placeholder="例：母より、昨夜から発熱。水分摂取はできている。"></textarea>
  </div>

  <div class="card">
    <b>薬歴イメージ</b>
    <p>S　自由記載</p>
    <p>O　処方・客観情報</p>
    <p>A　評価</p>
    <p>EP　服薬指導</p>
    <p>OP　次回確認</p>
  </div>
</main>

<div class="version-badge">Version v1.5</div>

<button id="drawerTab" class="drawer-tab" aria-expanded="false" aria-controls="drawer">
  入力補助
</button>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2>小児科サポート</h2>
    <button id="closeBtn" class="close-btn">閉じる</button>
  </div>

  <div class="top-info">
    <div class="measure-row">
      <div class="field">
        <div class="field-title">体重</div>
        <input id="weight" type="number" inputmode="decimal" step="0.1" placeholder="14.2">
        <span class="unit">kg</span>
      </div>

      <div class="field">
        <div class="field-title">体温</div>
        <input id="temperature" type="number" inputmode="decimal" step="0.1" placeholder="38.5">
        <span class="unit">℃</span>
      </div>
    </div>

    <div class="compact-record">
      <div class="record-title">アレルギー・副作用歴</div>
      <div class="record-row">
        <label><input type="radio" name="allergy" value="なし">なし</label>
        <label><input type="radio" name="allergy" value="あり">あり</label>
        <input id="allergyDetail" class="detail-input" type="text" placeholder="詳細" disabled>
        <label class="keep-label" title="その他にも継続情報として出力">
          <input id="allergyKeep" type="checkbox" disabled>継続
        </label>
      </div>
    </div>

    <div class="compact-record">
      <div class="record-title">既往歴</div>
      <div class="record-row">
        <label><input type="radio" name="history" value="なし">なし</label>
        <label><input type="radio" name="history" value="あり">あり</label>
        <input id="historyDetail" class="detail-input" type="text" placeholder="詳細" disabled>
        <label class="keep-label" title="その他にも継続情報として出力">
          <input id="historyKeep" type="checkbox" disabled>継続
        </label>
      </div>
    </div>
  </div>

  <h3>症状</h3>
  <div class="symptoms">
    <button class="sym">発熱</button><button class="sym">頭痛</button>
    <button class="sym">鼻汁</button><button class="sym">咽頭痛</button>
    <button class="sym">咳</button><button class="sym">喘鳴</button>
    <button class="sym">腹痛</button><button class="sym">嘔吐</button>
    <button class="sym">下痢</button><button class="sym">便秘</button>
    <button class="sym">発疹</button>
  </div>

  <h3>全身状態</h3>

  <div class="status-group" data-key="appetite">
    <div class="status-label">食事</div>
    <div class="status-options">
      <button class="status-btn" data-value="normal">摂取可</button>
      <button class="status-btn" data-value="low">少ない</button>
      <button class="status-btn" data-value="poor">摂取困難</button>
    </div>
  </div>

  <div class="status-group" data-key="fluid">
    <div class="status-label">水分</div>
    <div class="status-options">
      <button class="status-btn" data-value="normal">摂取可</button>
      <button class="status-btn" data-value="low">少ない</button>
      <button class="status-btn" data-value="poor">摂取困難</button>
    </div>
  </div>

  <div class="status-group" data-key="energy">
    <div class="status-label">元気</div>
    <div class="status-options">
      <button class="status-btn" data-value="normal">元気</button>
      <button class="status-btn" data-value="low">元気ない</button>
      <button class="status-btn" data-value="poor">ぐったり</button>
    </div>
  </div>

  <h3>生成テキスト</h3>
  <div id="out" class="out">（入力・選択するとここに生成されます）</div>

  <div class="actions">
    <button id="copy" class="action copy">コピー</button>
    <button id="clear" class="action clear">クリア</button>
  </div>
</aside>

<script>
const drawer=document.getElementById('drawer');
const drawerTab=document.getElementById('drawerTab');
const closeBtn=document.getElementById('closeBtn');

function setDrawer(open){
  drawer.classList.toggle('open',open);
  drawerTab.classList.toggle('open',open);
  drawer.setAttribute('aria-hidden',String(!open));
  drawerTab.setAttribute('aria-expanded',String(open));
  drawerTab.textContent=open ? '閉じる' : '入力補助';
}
drawerTab.addEventListener('click',()=>setDrawer(!drawer.classList.contains('open')));
closeBtn.addEventListener('click',()=>setDrawer(false));

const selectedSymptoms=[];
const symptomButtons=[...document.querySelectorAll('.sym')];
const out=document.getElementById('out');
const weight=document.getElementById('weight');
const temperature=document.getElementById('temperature');
const allergyRadios=[...document.querySelectorAll('input[name="allergy"]')];
const allergyDetail=document.getElementById('allergyDetail');
const allergyKeep=document.getElementById('allergyKeep');
const historyRadios=[...document.querySelectorAll('input[name="history"]')];
const historyDetail=document.getElementById('historyDetail');
const historyKeep=document.getElementById('historyKeep');

const statusState={
  appetite:null,
  fluid:null,
  energy:null
};

const statusText={
  appetite:{
    normal:'食事摂取可能。',
    low:'食事摂取少なめ。',
    poor:'食事摂取困難。'
  },
  fluid:{
    normal:'水分摂取可能。',
    low:'水分摂取少なめ。',
    poor:'水分摂取困難。'
  },
  energy:{
    normal:'元気あり。',
    low:'元気なし。',
    poor:'ぐったりしている。'
  }
};

function render(){
  const blocks=[];

  const sParts=[];

  if(selectedSymptoms.length){
    sParts.push(selectedSymptoms.join('、')+'あり。');
  }

  ['appetite','fluid','energy'].forEach(key=>{
    const value=statusState[key];
    if(value){
      sParts.push(statusText[key][value]);
    }
  });

  if(sParts.length){
    blocks.push('##S##\n'+sParts.join('\n'));
  }

  const oParts=[];
  const w=weight.value.trim();
  if(w){
    oParts.push('体重'+w+'kg。');
  }

  const t=temperature.value.trim();
  if(t){
    oParts.push('体温'+t+'℃。');
  }

  const allergy=allergyRadios.find(r=>r.checked)?.value;
  const allergyText=allergyDetail.value.trim();
  if(allergy==='なし'){
    oParts.push('アレルギー・副作用歴なし。');
  }else if(allergy==='あり'){
    oParts.push(allergyText ? 'アレルギー・副作用歴あり：'+allergyText : 'アレルギー・副作用歴あり');
  }

  const history=historyRadios.find(r=>r.checked)?.value;
  const historyText=historyDetail.value.trim();
  if(history==='なし'){
    oParts.push('既往歴なし。');
  }else if(history==='あり'){
    oParts.push(historyText ? '既往歴あり：'+historyText : '既往歴あり');
  }

  if(oParts.length){
    blocks.push('##O##\n'+oParts.join('\n'));
  }

  const otherParts=[];
  if(allergy==='あり' && allergyKeep.checked){
    otherParts.push('#アレルギー・副作用歴'+(allergyText ? '：'+allergyText : ''));
  }
  if(history==='あり' && historyKeep.checked){
    otherParts.push('#既往歴'+(historyText ? '：'+historyText : ''));
  }
  if(otherParts.length){
    blocks.push('##その他##\n'+otherParts.join('\n'));
  }

  out.textContent=blocks.length
    ? blocks.join('\n\n')
    : '（入力・選択するとここに生成されます）';
}

symptomButtons.forEach(b=>b.addEventListener('click',()=>{
  const s=b.textContent;
  const i=selectedSymptoms.indexOf(s);

  if(i>=0){
    selectedSymptoms.splice(i,1);
    b.classList.remove('on');
  }else{
    selectedSymptoms.push(s);
    b.classList.add('on');
  }
  render();
}));

document.querySelectorAll('.status-group').forEach(group=>{
  const key=group.dataset.key;
  const buttons=[...group.querySelectorAll('.status-btn')];

  buttons.forEach(btn=>{
    btn.addEventListener('click',()=>{
      const value=btn.dataset.value;

      if(statusState[key]===value){
        statusState[key]=null;
        btn.classList.remove('on');
      }else{
        statusState[key]=value;
        buttons.forEach(b=>b.classList.remove('on'));
        btn.classList.add('on');
      }
      render();
    });
  });
});

weight.addEventListener('input',render);
temperature.addEventListener('input',render);
allergyRadios.forEach(r=>r.addEventListener('change',()=>{
  const allergy=allergyRadios.find(r=>r.checked)?.value;
  const enabled = allergy==='あり';
  allergyDetail.disabled = !enabled;
  allergyKeep.disabled = !enabled;
  if(!enabled){
    allergyDetail.value='';
    allergyKeep.checked=false;
  }else{
    allergyDetail.focus();
  }
  render();
}));
allergyDetail.addEventListener('input',render);
allergyKeep.addEventListener('change',render);

historyRadios.forEach(r=>r.addEventListener('change',()=>{
  const history=historyRadios.find(r=>r.checked)?.value;
  const enabled = history==='あり';
  historyDetail.disabled = !enabled;
  historyKeep.disabled = !enabled;
  if(!enabled){
    historyDetail.value='';
    historyKeep.checked=false;
  }else{
    historyDetail.focus();
  }
  render();
}));
historyDetail.addEventListener('input',render);
historyKeep.addEventListener('change',render);

document.getElementById('clear').addEventListener('click',()=>{
  selectedSymptoms.length=0;
  symptomButtons.forEach(b=>b.classList.remove('on'));

  Object.keys(statusState).forEach(key=>statusState[key]=null);
  document.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('on'));

  weight.value='';
  temperature.value='';
  allergyRadios.forEach(r=>r.checked=false);
  allergyDetail.value='';
  allergyDetail.disabled=true;
  allergyKeep.checked=false;
  allergyKeep.disabled=true;
  historyRadios.forEach(r=>r.checked=false);
  historyDetail.value='';
  historyDetail.disabled=true;
  historyKeep.checked=false;
  historyKeep.disabled=true;

  render();
});

document.getElementById('copy').addEventListener('click',async()=>{
  const text=out.textContent;

  if(!text.startsWith('##')){
    alert('コピーする内容がありません');
    return;
  }

  try{
    await navigator.clipboard.writeText(text);
    alert('コピーしました');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    ta.remove();
    alert('コピーしました');
  }
});
</script>

</body>
</html>
